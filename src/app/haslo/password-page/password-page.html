<main class="password-page">
  <div class="password-layout">
    <img class="teddy-decoration" src="/assets/mis%20sredni.png" alt="" aria-hidden="true" />

    <section class="password-card" aria-labelledby="password-title">
      <img class="camera-icon" src="/assets/aparat%20maly.png" alt="" aria-hidden="true" />
      <h1 id="password-title">Wpisz hasło</h1>
      <p class="intro">Podaj hasło, aby przejść do strony uroczystości.</p>

      <form (submit)="$event.preventDefault(); submitPassword()">
        <label for="password">
          <svg
            class="lock-icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="10" width="16" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
          Hasło
        </label>
        <input
          id="password"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          enterkeyhint="go"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          autofocus
        />
        @if (errorMessage()) {
          <p class="error-message" role="alert">{{ errorMessage() }}</p>
        }
        <button type="submit">Przejdź dalej</button>
      </form>

      <img class="heart-divider" src="/assets/maly%20serce.png" alt="" aria-hidden="true" />
    </section>
  </div>
</main>

@if (interactionService.isBusy()) {
  <div class="interaction-backdrop" role="alert" aria-busy="true" aria-live="polite">
    <div class="interaction-loader">
      <span class="spinner" aria-hidden="true"></span>
      <strong>{{ interactionService.message() }}</strong>
      <span>Prosimy chwilę poczekać</span>
    </div>
  </div>
}
