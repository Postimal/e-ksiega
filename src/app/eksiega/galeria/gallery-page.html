<main class="gallery-page">
  <header class="gallery-header">
    <a class="back-link" routerLink="/">← Wróć do formularza</a>
    <img src="assets/logo.svg" alt="Logo e-księga gości" />
    <p class="eyebrow">Chrzest Święty i pierwsze urodziny</p>
    <h1>Galeria wspomnień</h1>
    <p class="intro">Zdjęcia i chwile z wyjątkowej, podwójnej uroczystości.</p>
  </header>

  <section class="gallery-grid" aria-label="Lista zdjęć">
    @for (photo of photos; track photo.label) {
      <figure class="gallery-item">
        <img [src]="photo.src" [alt]="photo.alt" />
        <figcaption>{{ photo.label }}</figcaption>
      </figure>
    }
  </section>

  <a class="button back-button" routerLink="/">Dodaj swoje zdjęcie i życzenia</a>
</main>
