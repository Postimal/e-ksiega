<div class="a4-page">
  <h1 class="header-title">Księga Pamiątkowa</h1>

  <h2 class="section-title">Życzenia od Gości</h2>

  <div class="wishes-grid">
    @for (item of wishes; track $index) {
       <div class="wish-card">
      <div class="wish-text">"{{ item.text }}"</div>
      <div class="wish-author">— {{ item.author }}</div>
    </div>
    }
  </div>

  @if(wishes.length === 0) {
<div  class="empty-state">
    Brak życzeń do wyświetlenia.
  </div>
  }

</div>
